<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Seamless Neon Double Pendulum Loop</title>
  <script src="https://unpkg.com/ccapture.js@1.1.0/build/CCapture.all.min.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05060a;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #05060a;
    }
    .ui {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
      pointer-events: none;
    }
    button {
      pointer-events: auto;
      border: 1px solid rgba(120, 255, 255, 0.25);
      background: rgba(10, 16, 28, 0.72);
      color: #dffcff;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(14px);
      box-shadow: 0 0 24px rgba(0, 255, 255, 0.12), 0 0 34px rgba(170, 80, 255, 0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.18), 0 0 44px rgba(170, 80, 255, 0.14);
    }
    button:disabled {
      cursor: default;
      opacity: 0.7;
    }
    .label {
      pointer-events: none;
      color: rgba(220, 250, 255, 0.78);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0, 255, 255, 0.35);
    }
  </style>
</head>
<body>
  <div class="ui">
    <button id="recordBtn">RECORD</button>
    <div class="label" id="status">Idle</div>
  </div>
  <canvas id="c"></canvas>

  <script>
    (() => {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: false });
      const recordBtn = document.getElementById('recordBtn');
      const statusEl = document.getElementById('status');

      const TAU = Math.PI * 2;
      const LOOP_FRAMES = 600; // 60 FPS × 10 seconds
      let frameCount = 0;
      let recording = false;
      let capturer = null;

      let W = 0, H = 0, SCALE = 2;

      function resize() {
        const cssW = window.innerWidth;
        const cssH = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;

        // Double the display size, then multiply by DPR for crisp recording.
        SCALE = 2 * dpr;

        canvas.width = Math.max(1, Math.floor(cssW * SCALE));
        canvas.height = Math.max(1, Math.floor(cssH * SCALE));
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';

        W = cssW;
        H = cssH;

        ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      }

      window.addEventListener('resize', resize, { passive: true });
      resize();

      function wrap01(x) {
        x = x % 1;
        return x < 0 ? x + 1 : x;
      }

      // Exact integer frequencies, fully periodic over 10 seconds.
      function angles(u) {
        const a1 =
          0.92 * Math.sin(TAU * 4 * u + 0.35) +
          0.20 * Math.sin(TAU * 8 * u + 1.10) +
          0.08 * Math.sin(TAU * 12 * u + 2.20);

        const a2 =
          1.08 * Math.sin(TAU * 7 * u + 2.05) +
          0.24 * Math.sin(TAU * 14 * u + 0.40) +
          0.10 * Math.sin(TAU * 21 * u + 1.75);

        return { a1, a2 };
      }

      function samplePose(u) {
        const ox = W * 0.5;
        const oy = H * 0.18;
        const L1 = Math.min(W, H) * 0.24;
        const L2 = Math.min(W, H) * 0.23;

        const { a1, a2 } = angles(u);

        const x1 = ox + Math.sin(a1) * L1;
        const y1 = oy + Math.cos(a1) * L1;

        const x2 = x1 + Math.sin(a2) * L2;
        const y2 = y1 + Math.cos(a2) * L2;

        return { ox, oy, x1, y1, x2, y2, L1, L2, a1, a2 };
      }

      function strokeGlowLine(x1, y1, x2, y2, color, width, blur, alpha, composite = 'lighter') {
        ctx.save();
        ctx.globalCompositeOperation = composite;
        ctx.strokeStyle = color;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = width;
        ctx.shadowColor = color;
        ctx.shadowBlur = blur;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.restore();
      }

      function fillGlowCircle(x, y, r, color, blur, alpha) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = color;
        ctx.globalAlpha = alpha;
        ctx.shadowColor = color;
        ctx.shadowBlur = blur;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function background(u) {
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';

        const g = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
        g.addColorStop(0.0, '#090b12');
        g.addColorStop(0.55, '#05060a');
        g.addColorStop(1.0, '#020308');

        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        // Subtle central pulse to reinforce the beat.
        const pulse = 0.5 + 0.5 * Math.sin(TAU * 4 * u);
        const halo = ctx.createRadialGradient(W * 0.5, H * 0.22, 0, W * 0.5, H * 0.22, Math.min(W, H) * 0.42);
        halo.addColorStop(0.0, `rgba(0,255,255,${0.08 + pulse * 0.05})`);
        halo.addColorStop(0.35, `rgba(170,80,255,${0.05 + pulse * 0.03})`);
        halo.addColorStop(1.0, 'rgba(0,0,0,0)');
        ctx.fillStyle = halo;
        ctx.fillRect(0, 0, W, H);

        ctx.restore();
      }

      function drawTrail(currentU, segmentCount, span, color, width, blur, headScale) {
        const pts = [];
        for (let i = 0; i <= segmentCount; i++) {
          const t = wrap01(currentU - (i / segmentCount) * span);
          const p = samplePose(t);
          pts.push({
            x: headScale === 1 ? p.x1 : p.x2,
            y: headScale === 1 ? p.y1 : p.y2
          });
        }

        for (let i = 0; i < segmentCount; i++) {
          const a = i / segmentCount;
          const fade = Math.pow(1 - a, 1.8);
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = color;
          ctx.globalAlpha = 0.03 + fade * 0.48;
          ctx.lineWidth = width * (0.35 + fade * 0.85);
          ctx.shadowColor = color;
          ctx.shadowBlur = blur * (0.35 + fade * 0.9);
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[i + 1].x, pts[i + 1].y);
          ctx.stroke();
          ctx.restore();
        }
      }

      function render() {
        const u = frameCount / LOOP_FRAMES;
        const pose = samplePose(u);

        background(u);

        // Loopable motion trails built from harmonic samples, not persistent canvas decay.
        drawTrail(u, 72, 0.22, 'rgba(0, 255, 255, 1)', 3.2, 18, 1);
        drawTrail(u, 72, 0.28, 'rgba(190, 95, 255, 1)', 2.8, 16, 2);

        // Faint secondary energy ribbons.
        drawTrail(u, 42, 0.10, 'rgba(110, 255, 255, 1)', 1.2, 10, 1);
        drawTrail(u, 42, 0.12, 'rgba(255, 140, 255, 1)', 1.0, 10, 2);

        // Current rigid arms.
        strokeGlowLine(pose.ox, pose.oy, pose.x1, pose.y1, 'rgba(0,255,255,1)', 9.5, 24, 0.16);
        strokeGlowLine(pose.ox, pose.oy, pose.x1, pose.y1, 'rgba(0,255,255,1)', 2.3, 10, 1.0);
        strokeGlowLine(pose.x1, pose.y1, pose.x2, pose.y2, 'rgba(190,95,255,1)', 9.5, 24, 0.16);
        strokeGlowLine(pose.x1, pose.y1, pose.x2, pose.y2, 'rgba(190,95,255,1)', 2.3, 10, 1.0);

        // Pivot and joints.
        fillGlowCircle(pose.ox, pose.oy, 6.5, 'rgba(255,255,255,1)', 18, 0.22);
        fillGlowCircle(pose.ox, pose.oy, 3.2, 'rgba(200,255,255,1)', 10, 1.0);

        fillGlowCircle(pose.x1, pose.y1, 8.5, 'rgba(0,255,255,1)', 20, 0.22);
        fillGlowCircle(pose.x1, pose.y1, 4.0, 'rgba(180,255,255,1)', 10, 1.0);

        fillGlowCircle(pose.x2, pose.y2, 12.0, 'rgba(190,95,255,1)', 26, 0.28);
        fillGlowCircle(pose.x2, pose.y2, 5.5, 'rgba(255,220,255,1)', 11, 1.0);

        // Subtle floor reflection beneath the bob.
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const refl = ctx.createLinearGradient(0, H * 0.55, 0, H);
        refl.addColorStop(0, 'rgba(0,0,0,0)');
        refl.addColorStop(1, 'rgba(110,60,255,0.08)');
        ctx.fillStyle = refl;
        ctx.fillRect(0, H * 0.55, W, H * 0.45);
        ctx.restore();

        // Recording capture at the very end of the draw loop.
        if (recording && capturer) {
          capturer.capture(canvas);
          if (frameCount === LOOP_FRAMES - 1) {
            recording = false;
            statusEl.textContent = 'Saving...';
            recordBtn.disabled = true;
            capturer.stop();
            capturer.save();
            frameCount = 0;
            setTimeout(() => {
              recordBtn.disabled = false;
              statusEl.textContent = 'Saved';
            }, 0);
          }
        }

        if (!recording) {
          frameCount = (frameCount + 1) % LOOP_FRAMES;
        } else {
          if (frameCount < LOOP_FRAMES - 1) frameCount += 1;
        }

        requestAnimationFrame(render);
      }

      recordBtn.addEventListener('click', () => {
        if (recording) return;

        capturer = new CCapture({
          format: 'webm',
          framerate: 60,
          quality: 100,
          verbose: true,
          display: false,
          autoSaveTime: 0,
          timeLimit: 0,
          videoBitsPerSecond: 5000000
        });

        frameCount = 0;
        recording = true;
        statusEl.textContent = 'Recording';
        recordBtn.disabled = true;
        capturer.start();
      });

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
